UMICOM_OS_BOOT 1
# Both checks are normal user-space one-shot services. A failure stops the
# graph and leaves the independent recovery console available.
hostname=umicom
service=platform-check|/usr/libexec/umicom-platform-check|-|3000
service=framework-probe|/usr/libexec/umicom-framework-probe|platform-check|5000
